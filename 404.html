<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found · Md Mehedi Hasan Tuhin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/images/nem_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b10;
            color: #f2f2f6;
            font-family: "Space Grotesk", sans-serif;
            text-align: center;
            padding: 2rem;
            background-image:
                radial-gradient(ellipse 50% 40% at 75% 12%, rgba(244, 63, 94, 0.12), transparent 70%),
                radial-gradient(ellipse 45% 35% at 12% 85%, rgba(251, 191, 36, 0.10), transparent 70%);
        }
        .mono { font-family: "JetBrains Mono", monospace; }
        h1 { font-size: clamp(5rem, 18vw, 9rem); line-height: 1; color: #f43f5e; }
        p { color: #a2a2b3; margin: 1rem 0 2rem; font-size: 1.05rem; }
        code { color: #fbbf24; }
        a {
            display: inline-block;
            color: #fff;
            background: #f43f5e;
            text-decoration: none;
            font-weight: 600;
            padding: 0.85rem 1.6rem;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        a:hover { background: #fb7185; transform: translateY(-2px); }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p class="mono">render status: <code>:not_found</code> — this route doesn't exist.</p>
        <a href="/">cd ~/home</a>
    </main>
</body>
